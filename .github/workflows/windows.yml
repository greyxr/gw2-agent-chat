name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned OpenCode CLI
        run: npm ci
      - name: Verify OpenCode version
        run: .\node_modules\opencode-ai\bin\opencode.exe --version
      - name: Run Go tests including Windows ACL checks
        run: go test ./...
      - name: Configure x64 MSVC build
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build add-on and parser test
        run: cmake --build build --config Release --parallel
      - name: Run parser test
        run: ctest --test-dir build -C Release --output-on-failure
